<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#0f172a">

<title>Panel Padre</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.hijo{
background:#334155;
padding:15px;
border-radius:15px;
margin-top:10px;
}

button{
background:#ef4444;
color:white;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>👨‍👩‍👧 Panel Padre</h1>

<div
style="
display:flex;
gap:10px;
margin-top:20px;
margin-bottom:20px;
"
>

<button
onclick="
location.href='chat.html'
"
style="
background:#2563eb;
"
>
💬 Chat
</button>

<button
onclick="logout()"
>
🚪 Cerrar sesión
</button>

</div>

<div id="contenido"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const API =
'https://cepm-v2.onrender.com'

const token =
localStorage.getItem('token')

async function cargar(){

const usuarios =
await fetch(

`${API}/usuarios`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

const padre =
JSON.parse(

atob(
token.split('.')[1]
)

)

const datosPadre =
usuarios.find(u=>

u._id===padre.id
)

const hijos =
usuarios.filter(u=>

datosPadre.hijos.includes(
u._id
)

)

document.getElementById(
'contenido'
).innerHTML =

`

<div class="card">

<h2>
👨‍🎓 Mis hijos
</h2>

${hijos.map(h=>`

<div class="hijo">

    <b>${h.nombre}</b>

    <br>

    Usuario: ${h.usuario}

    <div
id="calificaciones-${h._id}"
style="margin-top:15px;"
>
</div>

<button
onclick="generarBoleta('${h._id}')"
style="
margin-top:15px;
background:#22c55e;
color:white;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
"
>

📄 Descargar Boleta

</button>

</div>

`).join('')}

</div>

`

const calificaciones =
await fetch(

`${API}/calificaciones`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

const clases =
await fetch(

`${API}/clases`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

const materias =
await fetch(

`${API}/materias`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

hijos.forEach(h=>{

    const calHijo =
    calificaciones.filter(c=>

        c.alumnoId===h._id
    )

    document.getElementById(

        `calificaciones-${h._id}`

    ).innerHTML =

    `
    <h4>
        📝 Calificaciones
    </h4>

    ${calHijo.length===0 ?

    'Sin calificaciones'

    :

calHijo.map(c=>{

    const clase =
    clases.find(cl=>

        cl._id===c.claseId
    )

    const materia =
    materias.find(m=>

        m._id===clase?.materiaId
    )

    return `

    <div
    style="
    background:#475569;
    padding:10px;
    border-radius:10px;
    margin-top:8px;
    "
    >

        📚 ${materia?.nombre || 'Materia'}

        <br>

        ⭐ ${c.calificacion}

    </div>

    `

}).join('')}

    `
})

}

async function generarBoleta(alumnoId){

    const { jsPDF } = window.jspdf

    const doc = new jsPDF()

    const usuarios =
    await fetch(

        `${API}/usuarios`,

        {
            headers:{
                Authorization:token
            }
        }

    ).then(r=>r.json())

    const alumno =
    usuarios.find(u=>

        u._id===alumnoId
    )

    const clases =
    await fetch(

        `${API}/clases`,

        {
            headers:{
                Authorization:token
            }
        }

    ).then(r=>r.json())

    const materias =
    await fetch(

        `${API}/materias`,

        {
            headers:{
                Authorization:token
            }
        }

    ).then(r=>r.json())

    const calificaciones =
    await fetch(

        `${API}/calificaciones`,

        {
            headers:{
                Authorization:token
            }
        }

    ).then(r=>r.json())

    doc.setFontSize(22)

    doc.text(
        'BOLETA CEPM',
        20,
        20
    )

    doc.setFontSize(14)

    doc.text(
        `Alumno: ${alumno.nombre}`,
        20,
        40
    )

    let y = 60

    let suma = 0
    let total = 0

    calificaciones
    .filter(c=>c.alumnoId===alumnoId)
    .forEach(c=>{

        const clase =
        clases.find(cl=>

            cl._id===c.claseId
        )

        const materia =
        materias.find(m=>

            m._id===clase?.materiaId
        )

        doc.text(

            `${materia?.nombre || 'Materia'} : ${c.calificacion}`,

            20,

            y
        )

        suma += Number(
            c.calificacion
        )

        total++

        y += 10
    })

    const promedio =
    total>0

    ?

    (suma/total).toFixed(1)

    :

    '0'

    y += 15

    doc.text(

        `Promedio General: ${promedio}`,

        20,

        y
    )

    y += 15

    doc.text(

        `Fecha: ${new Date().toLocaleDateString()}`,

        20,

        y
    )

    doc.save(

        `Boleta_${alumno.nombre}.pdf`
    )
}

function logout(){

localStorage.clear()

location.href='index.html'
}

cargar()

</script>

<script>

if('serviceWorker' in navigator){

navigator.serviceWorker.register(
'/service-worker.js'
)

}

</script>

</body>
</html>
