<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Chat CEPM</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

body{
background:#0f172a;
color:white;
margin:0;
font-family:Arial;
display:flex;
height:100vh;
}

#usuarios{
width:280px;
background:#111827;
overflow:auto;
padding:20px;
border-right:1px solid #1e293b;
}

.usuario{
background:#1e293b;
padding:15px;
border-radius:15px;
cursor:pointer;
margin-bottom:10px;
transition:.2s;
}

.usuario:hover{
background:#334155;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#encabezado{
background:#111827;
padding:15px;
font-weight:bold;
font-size:18px;
border-bottom:1px solid #1e293b;
}

#mensajes{
flex:1;
overflow-y:auto;
padding:15px;
}

.mio{
background:#22c55e;
max-width:75%;
margin-left:auto;
margin-bottom:10px;
padding:12px;
border-radius:18px;
word-wrap:break-word;
}

.otro{
background:#334155;
max-width:75%;
margin-bottom:10px;
padding:12px;
border-radius:18px;
word-wrap:break-word;
}

#barra{
display:flex;
padding:15px;
background:#111827;
gap:10px;
}

#texto{
flex:1;
padding:14px;
font-size:16px;
border:none;
border-radius:10px;
}

@media(max-width:768px){

body{
    flex-direction:column;
    height:100vh;
}

#usuarios{
    width:100%;
    height:110px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    padding:10px;
    border-right:none;
    border-bottom:1px solid #1e293b;
}

.usuario{
    min-width:180px;
    margin:0;
    flex-shrink:0;
}

#chat{
    width:100%;
    flex:1;
}

#mensajes{
    flex:1;
    padding:15px;
}

#barra{
    padding:10px;
}

#texto{
    flex:1;
}

}

</style>

</head>

<body>

<div id="usuarios"></div>

<div id="chat">

<div id="encabezado">

Selecciona un usuario 💬

</div>

<div id="mensajes"></div>

<div id="barra">

<input
id="texto"
placeholder="Escribe..."
>

<button
onclick="enviarMensaje()"
>
Enviar
</button>

</div>

</div>

<script>

const API =
'https://cepm-v2.onrender.com'

const token =
localStorage.getItem('token')

const socket =
io(API)

const usuario =
JSON.parse(

atob(
token.split('.')[1]
)

)

socket.emit(
'registrar',
usuario.id
)

let receptorId = null

async function cargarUsuarios(){

const usuarios =
await fetch(

`${API}/usuarios`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

document
.getElementById(
'usuarios'
)

.innerHTML = usuarios

.filter(u=>

u._id!==usuario.id
)

.map(u=>`

<div
class="usuario"

onclick="
abrirChat(
'${u._id}'
)
"
>

${u.nombre}

<br>

${u.rol}

</div>

`).join('')
}

async function abrirChat(id){

receptorId = id

const usuarios =
await fetch(

`${API}/usuarios`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

const contacto =
usuarios.find(u=>u._id===id)

document.getElementById(
'encabezado'
).innerHTML =
`💬 ${contacto.nombre}`

const mensajes =
await fetch(

`${API}/mensajes/${usuario.id}/${id}`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

mostrarMensajes(
mensajes
)
}

function mostrarMensajes(mensajes){

document
.getElementById(
'mensajes'
)

.innerHTML = mensajes.map(m=>`

<div
class="${
m.emisorId===usuario.id
?
'mio'
:
'otro'
}"
>

${m.texto}

</div>

`).join('')

const div =
document.getElementById(
'mensajes'
)

setTimeout(()=>{

div.scrollTop =
div.scrollHeight

},100)
}


async function enviarMensaje(){

const texto =
document.getElementById(
'texto'
).value

if(!texto) return

await fetch(

`${API}/mensajes`,

{

method:'POST',

headers:{

'Content-Type':
'application/json',

Authorization:token

},

body:JSON.stringify({

emisorId:
usuario.id,

receptorId,

texto

})

}

)

document.getElementById(
'texto'
).value=''

abrirChat(
receptorId
)
}

socket.on(

'nuevoMensaje',

()=>{

if(receptorId){

abrirChat(
receptorId
)

}

})

cargarUsuarios()

</script>

</body>

</html>
