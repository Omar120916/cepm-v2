<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Chat CEPM</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

body{
background:#0f172a;
color:white;
margin:0;
font-family:Arial;
display:flex;
height:100vh;
}

#usuarios{
width:300px;
background:#111827;
overflow:auto;
padding:20px;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#mensajes{
flex:1;
overflow:auto;
padding:20px;
}

.usuario{
padding:15px;
background:#1e293b;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

.mio{
background:#22c55e;
padding:10px;
border-radius:10px;
margin:10px;
max-width:70%;
margin-left:auto;
}

.otro{
background:#334155;
padding:10px;
border-radius:10px;
margin:10px;
max-width:70%;
}

#barra{
display:flex;
padding:15px;
background:#111827;
}

#texto{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

button{
margin-left:10px;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="usuarios"></div>

<div id="chat">

<div id="mensajes"></div>

<div id="barra">

<input
id="texto"
placeholder="Escribe..."
>

<button
onclick="enviarMensaje()"
>

Enviar

</button>

</div>

</div>

<script>

const API =
'https://cepm-v2.onrender.com'

const token =
localStorage.getItem('token')

const socket =
io(API)

const usuario =
JSON.parse(

atob(
token.split('.')[1]
)

)

socket.emit(
'registrar',
usuario.id
)

let receptorId = null

async function cargarUsuarios(){

const usuarios =
await fetch(

`${API}/usuarios`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

document
.getElementById(
'usuarios'
)

.innerHTML = usuarios

.filter(u=>

u._id!==usuario.id
)

.map(u=>`

<div
class="usuario"

onclick="
abrirChat(
'${u._id}'
)
"
>

${u.nombre}

<br>

${u.rol}

</div>

`).join('')
}

async function abrirChat(id){

receptorId = id

const mensajes =
await fetch(

`${API}/mensajes/${usuario.id}/${id}`,

{
headers:{
Authorization:token
}
}

).then(r=>r.json())

mostrarMensajes(
mensajes
)
}

function mostrarMensajes(mensajes){

document
.getElementById(
'mensajes'
)

.innerHTML = mensajes.map(m=>`

<div
class="${
m.emisorId===usuario.id
?
'mio'
:
'otro'
}"
>

${m.texto}

</div>

`).join('')
}

async function enviarMensaje(){

const texto =
document.getElementById(
'texto'
).value

if(!texto) return

await fetch(

`${API}/mensajes`,

{

method:'POST',

headers:{

'Content-Type':
'application/json',

Authorization:token

},

body:JSON.stringify({

emisorId:
usuario.id,

receptorId,

texto

})

}

)

document.getElementById(
'texto'
).value=''

abrirChat(
receptorId
)
}

socket.on(

'nuevoMensaje',

()=>{

if(receptorId){

abrirChat(
receptorId
)

}

})

cargarUsuarios()

</script>

</body>

</html>
